<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indodax Live Dashboard</title>
    <meta http-equiv="refresh" content="0; url=public/dashboard.html" />
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #0d1a2a;
        --panel: rgba(17, 24, 39, 0.9);
        --panel-border: rgba(148, 163, 184, 0.15);
        --primary: #5eead4;
        --secondary: #7dd3fc;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #07111f, #020817 45%, #0f172a 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .badge {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #0f172a;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 11px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      }

      .card small {
        display: block;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .card strong {
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 20px;
      }

      .panel h3 {
        margin: 0 0 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .up { color: var(--success); }
      .down { color: var(--danger); }
      .neutral { color: var(--warning); }

      .status-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .green { background: rgba(52, 211, 153, 0.14); color: var(--success); }
      .orange { background: rgba(251, 191, 36, 0.12); color: var(--warning); }
      .red { background: rgba(248, 113, 113, 0.12); color: var(--danger); }

      @media (max-width: 900px) {
        .summary-grid, .layout {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div>
          <p style="margin:0 0 8px; color:#7dd3fc; letter-spacing:0.12em; font-size:12px; text-transform:uppercase;">Algorithmic Trading • UAS</p>
          <h1>Indodax Live Dashboard</h1>
        </div>
        <div class="badge" id="dataSource">LIVE MARKET DATA</div>
      </header>

      <section class="summary-grid">
        <div class="card">
          <small>Modal Virtual</small>
          <strong id="capital">Rp0</strong>
        </div>
        <div class="card">
          <small>Equity</small>
          <strong id="equity">Rp0</strong>
        </div>
        <div class="card">
          <small>Daily PnL</small>
          <strong id="pnl">Rp0</strong>
        </div>
        <div class="card">
          <small>Status</small>
          <strong id="statusText">Loading...</strong>
        </div>
      </section>

      <section class="layout">
        <div class="panel">
          <h3>7 Universe</h3>
          <table>
            <thead>
              <tr>
                <th>Pair</th>
                <th>Last Price</th>
                <th>24h</th>
                <th>24h Bias</th>
              </tr>
            </thead>
            <tbody id="marketTable"></tbody>
          </table>
        </div>

        <div class="panel">
          <h3>Bot Status</h3>
          <div class="status-badges">
            <span class="pill green" id="pillTrend">Trend bullish</span>
            <span class="pill orange" id="pillRisk">Risk OK</span>
            <span class="pill red" id="pillKill">Kill switch OFF</span>
          </div>

          <div style="margin-top: 18px;">
            <p style="color: var(--muted); margin-bottom: 6px;">Last update</p>
            <strong id="lastUpdated">Waiting...</strong>
          </div>

          <div style="margin-top: 18px;">
            <p style="color: var(--muted); margin-bottom: 6px;">Notes</p>
            <p id="notes" style="line-height:1.6; margin:0; color:#dbeafe;">
              Mengambil data pasar live.
            </p>
          </div>
        </div>
      </section>
    </div>

    <script>
      const pairs = [
        'BTC/IDR', 'ETH/IDR', 'SOL/IDR', 'BNB/IDR', 'XRP/IDR', 'ADA/IDR', 'DOGE/IDR'
      ];

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: 'IDR',
          maximumFractionDigits: 0
        }).format(value || 0);
      };

      const formatSigned = (value) => {
        const sign = value > 0 ? '+' : '';
        return `${sign}${value.toFixed(2)}%`;
      };

      async function loadMarket() {
        try {
          const res = await fetch('/api/market', { cache: 'no-store' });
          if (!res.ok) throw new Error('Proxy API error');

          const payload = await res.json();
          const marketData = payload?.data ?? [];
          const isReference = payload.source !== 'indodax';

          const rows = marketData.map((ticker) => {
            const trendClass = ticker.change > 0 ? 'up' : ticker.change < 0 ? 'down' : 'neutral';
            const bias = ticker.change > 0 ? 'UP' : ticker.change < 0 ? 'DOWN' : 'FLAT';
            return `
              <tr>
                <td>${ticker.pair}</td>
                <td>${formatCurrency(ticker.price)}</td>
                <td class="${trendClass}">${formatSigned(ticker.change)}</td>
                <td class="${trendClass}">${bias}</td>
              </tr>
            `;
          }).join('');

          document.getElementById('marketTable').innerHTML = rows;
          document.getElementById('statusText').textContent = isReference ? 'Live reference' : 'Indodax';
          document.getElementById('dataSource').textContent = isReference ? 'BINANCE + USD/IDR REFERENCE' : 'INDODAX LIVE';
          document.getElementById('lastUpdated').textContent = new Date(payload.generatedAt).toLocaleString('id-ID');
          document.getElementById('capital').textContent = formatCurrency(100000000);
          document.getElementById('equity').textContent = formatCurrency(100000000);
          document.getElementById('pnl').textContent = formatCurrency(0);
          document.getElementById('notes').textContent = isReference
            ? 'Indodax membatasi akses API dari jaringan ini. Harga referensi berasal dari Binance USDT dan dikonversi memakai kurs USD/IDR publik; bukan harga eksekusi Indodax.'
            : 'Data ticker live diambil langsung dari API publik Indodax.';
        } catch (error) {
          document.getElementById('statusText').textContent = 'API Error';
          document.getElementById('notes').textContent = 'Gagal mengambil data pasar. Periksa koneksi internet atau server lokal.';
        }
      }

      loadMarket();
      setInterval(loadMarket, 15000);
    </script>
  </body>
</html>
